app:
  name: AlejandrIA Magazine
  version: 0.2.0
  debug: true
llm:
  # Motor agéntico por defecto: Claude (Anthropic) — SPEC-023 / ADR-0009.
  # Cambia a 'ollama' (on-prem local) o 'openai' (compatible: vLLM/LM Studio) para
  # soberanía de datos. La variable de entorno LLM_PROVIDER tiene mayor prioridad.
  provider: anthropic
ollama:
  base_url: http://localhost:11434
  default_model: mistral:7b
  embed_model: nomic-embed-text
openai:
  api_key: ''
  model: gpt-4o-mini
  embed_model: text-embedding-3-small
  base_url: null
anthropic:
  # Motor por defecto. La API key NO se versiona: inyéctala con ANTHROPIC_API_KEY
  # (env, mayor prioridad). Su ausencia no aborta el arranque; la primera llamada
  # al LLM falla (error perezoso). Anthropic no ofrece embeddings: el RAG sigue
  # en ollama/openai aunque la generación sea Claude.
  api_key: ''
  model: claude-opus-5        # default global; el modelo por agente llega en T12.3
  base_url: null              # gateway/proxy opcional; null = endpoint oficial
  max_tokens: 4096
database:
  url: sqlite+aiosqlite:///./data/dev.db
security:
  secret_key: CAMBIA-ESTO-EN-PRODUCCION-usa-openssl-rand-hex-32
  algorithm: HS256
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7
  # Brute-force / credential-stuffing protection for /auth/login y /auth/register.
  # Rate limit por IP (ventana deslizante) + bloqueo temporal de cuenta tras
  # varios intentos fallidos consecutivos. Pon max=0 para deshabilitar cada uno.
  auth_ratelimit_max_attempts: 10      # intentos por ventana y por IP (0 = off)
  auth_ratelimit_window_seconds: 60    # longitud de la ventana, en segundos
  auth_lockout_max_failed: 5           # fallos consecutivos antes de bloquear (0 = off)
  auth_lockout_seconds: 900            # duración del bloqueo de cuenta (15 min)
access_control:
  # Secure by default: dev-only role promotion shortcut stays OFF.
  # Enable explicitly (and only) in local development.
  enable_dev_role_promotion: false
  # Siembra de demo (SPEC-015/T1.6): usuarios con credenciales conocidas
  # (admin@admin/admin123 y compañía) y contenido de ejemplo. Apagada por defecto;
  # con DEBUG=false su valor efectivo es False aunque aquí se ponga true.
  enable_dev_seed: false
  # Role assigned on self-registration. Minimal privilege: lector | publico.
  default_signup_role: lector
qdrant:
  url: http://localhost:6333
  api_key: null
  collection: rag_docs
  vector_size: 768
rag:
  chunk_size: 800
  chunk_overlap: 80
  top_k: 6
  score_threshold: 0.5
agents:
  investigador:
    model: null
    temperature: 0.3
    rag_enabled: true
    rag_collection: rag_docs
    rag_top_k: 6
    rag_chunk_size: 800
    semantic_rerank: true
  redactor:
    model: qwen3.6:latest
    temperature: 0.7
    rag_enabled: false
  revisor:
    model: llama3.2:3b
    temperature: 0.2
    rag_enabled: false
  formateador:
    model: llama3.2:1b
    temperature: 0.4
    rag_enabled: false
  publicador:
    model: llama3.2:1b
    rag_enabled: false

# Retención de datos (SPEC-020/T6.5). Ventanas en días; 0 desactiva esa purga.
# Se aplican con: cd backend && python -m app.platform.retention [--apply]
# Razonadas en docs/governance/data-retention.md — cambiarlas aquí obliga a
# actualizar ese documento (hay un test que lo comprueba).
retention:
  audit_log_days: 365
  agent_runs_days: 90
  checkpoints_days: 30
  notifications_days: 90
  orphan_assets_days: 30

# Coordinación entre workers (SPEC-018/T4.3): pub/sub de eventos SSE, decisiones
# HITL y tickets de stream. Necesario para correr con más de un worker; con uno
# solo el bus en proceso basta y no hace falta levantar Redis.
redis:
  url: redis://localhost:6379/0
  enabled: false

# Tracing OpenTelemetry (SPEC-019/T5.3). Apagado por defecto: exporta a un colector
# externo. Cada petición y cada paso de agente generan spans anidados.
otel:
  enabled: false
  service_name: alejandria-backend
  # Endpoint OTLP/HTTP del colector, p. ej. http://otel-collector:4318
  endpoint: ""

# Egress de las herramientas de agente (SPEC-024/T2.5). Solo aplica a los destinos
# que elige el usuario o el modelo — `fetch_url` y la búsqueda académica—, no a la
# infraestructura (Ollama, Qdrant, proveedores de LLM), que es privada a propósito.
# Lo interno (loopback, redes privadas, enlace-local y el endpoint de metadatos de
# la nube) se bloquea siempre, esté o no en la allowlist.
egress:
  # Dominios separados por comas. Vacío = todo lo público. Poblado, solo lo listado.
  allowed_domains: ""
  # Se rechazan aunque estén en la allowlist.
  denied_domains: ""
  # `http://` en claro. Apagado: en claro la respuesta es manipulable.
  allow_http: false
  max_redirects: 3
