name: Claude · digest diario

# Resumen diario al móvil (GOVERNANCE §7 — overview del trabajo en curso).
# Días laborables a las 09:00 Europe/Madrid: Claude publica un digest de PRs
# abiertas + tareas listas + recomendación, en una issue "inbox", y te menciona
# para que llegue como push de la app de GitHub al teléfono.
#
# Nota: cron de GitHub Actions corre en UTC y no ajusta DST.
#   07:00 UTC = 09:00 CEST (verano) / 08:00 CET (invierno).
on:
  schedule:
    - cron: "0 7 * * 1-5"
  # Permite probarlo a mano desde la pestaña Actions (también en el móvil).
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

# Destinatario de la mención (dispara el push de GitHub en el móvil).
env:
  DIGEST_RECIPIENT: luxinopanyvino
  DIGEST_ISSUE_TITLE: "📬 Digest diario de PRs y tareas"

jobs:
  digest:
    name: Claude · generar digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generar y publicar digest
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(gh:*),Bash(date:*)"'
          prompt: |
            Genera un digest diario para el equipo y publícalo en GitHub.
            Trabaja en el repo ${{ github.repository }} usando la CLI `gh`.
            Responde y escribe todo en español.

            ## 1. Recopila datos
            - PRs abiertas contra `develop`:
              `gh pr list --base develop --state open --json number,title,headRefName,isDraft,reviewDecision,statusCheckRollup,updatedAt`
              Para cada una resume: qué es, estado de CI (verde/rojo/pendiente),
              estado de review y qué falta para poder mergear.
            - Tareas listas del backlog (aproximación con labels, el token no lee
              el estado "Ready" del Project): issues abiertas con label `task`:
              `gh issue list --state open --label task --json number,title,labels,updatedAt`
              Trátalas como "listas" si NO están bloqueadas y NO tienen ya una PR
              abierta que las cierre. Prioriza por label `sev/*` (🔴 alta > 🟠 media).

            ## 2. Redacta el digest (markdown, conciso)
            Estructura:
            - **Fecha** (usa `date +%Y-%m-%d`).
            - **PRs abiertas** — lista con enlace `#<n>`, una línea de estado y
              "qué falta" cada una. Si no hay, dilo.
            - **Tareas listas** — top 5 por prioridad, con `#<n>` y label de severidad.
            - **👉 Recomendación** — 1-2 frases: qué atacar primero hoy y por qué
              (primero desbloquear PRs a punto de merge; luego 🔴, luego 🟠 de bajo
              esfuerzo, según ADR-0003 y GOVERNANCE §7).

            ## 3. Publica
            - Busca una issue abierta cuyo título sea exactamente
              "${{ env.DIGEST_ISSUE_TITLE }}":
              `gh issue list --state open --search "${{ env.DIGEST_ISSUE_TITLE }} in:title" --json number,title`
            - Si no existe, créala una sola vez:
              `gh issue create --title "${{ env.DIGEST_ISSUE_TITLE }}" --body "Issue-inbox para los digests diarios automáticos. No cerrar."`
            - Añade el digest como **comentario** en esa issue
              (`gh issue comment <n> --body-file <archivo>`), y **termina el
              comentario con una mención a `@${{ env.DIGEST_RECIPIENT }}`** para
              que le llegue como notificación push al móvil.
            - No abras PRs, no cierres issues, no toques código.
