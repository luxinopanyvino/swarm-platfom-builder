name: Claude · auto-review

# Revisión automática con Claude en cada PR a develop (GOVERNANCE §4).
# Complementa al gate de CI (ci.yml): CI verifica; Claude comenta hallazgos.
# Permite revisar la PR desde el móvil (app de GitHub) sin abrir el portátil.
#
# Requisitos (uno solo):
#   - GitHub App "Claude" instalada en el repo, y
#   - Secret CLAUDE_CODE_OAUTH_TOKEN (recomendado) o ANTHROPIC_API_KEY.
# Si el secret no existe, el job se salta sin fallar el PR.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    branches: [develop]

# Una revisión por PR; cancela la anterior si llega un push nuevo.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Claude · revisar PR
    runs-on: ubuntu-latest
    # No revisar PRs en borrador.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Revisión con Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Eres revisor de una PR contra `develop`. Revisa el diff y deja
            comentarios accionables. Responde en español.

            Prioriza, en este orden:
            1. Bugs de correctitud y regresiones.
            2. Seguridad: auth, manejo de secretos/PII, validación de entrada,
               egress (ver docs/adr/0003 y GOVERNANCE §8).
            3. Cumplimiento de la Definition of Done (GOVERNANCE §6): tests que
               cubran el cambio, docs/spec/ADR actualizados, sin secretos en el diff.
            4. Reutilización, simplificación y eficiencia.

            Verifica también la convención de nombre de rama (GOVERNANCE §3):
            prefijo `feat/`, `fix/`, `docs/`, `chore/` o `sec/` según el cambio.

            Sé conciso. Si no hay hallazgos relevantes, dilo en una línea y aprueba.
